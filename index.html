<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Civil 3D + AutoCAD 2026 Command Search</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fb; color: #1f2937; }
    .container { max-width: 980px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 16px; }
    .panel { background: #fff; border: 1px solid #d6dbe6; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
    .controls { display: grid; grid-template-columns: 1fr 190px 190px; gap: 10px; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cad2e2; border-radius: 8px; font-size: 0.95rem; }
    .meta { font-size: 0.9rem; color: #4b5563; margin-top: 8px; }
    .results { display: grid; gap: 10px; }
    .card { background: #fff; border: 1px solid #d6dbe6; border-radius: 10px; padding: 12px; }
    .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .name { font-weight: 700; }
    .badge { font-size: 0.75rem; padding: 3px 8px; border-radius: 999px; background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
    .shortcut { margin-top: 5px; font-size: 0.86rem; color: #1d4ed8; font-weight: 700; }
    .task { margin-top: 5px; font-size: 0.9rem; color: #374151; }
    .empty { background: #fff; border: 1px dashed #b6c0d4; border-radius: 10px; padding: 14px; color: #374151; }
    @media (max-width: 760px) { .controls { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Civil 3D + AutoCAD 2026 Command Search</h1>
    <p>Ask for a task and find the matching command or shortcut.</p>

    <div class="panel">
      <div class="controls">
        <input id="query" type="text" placeholder="Example: How do I create a corridor and label sections?" />
        <select id="product">
          <option value="all">All products</option>
          <option value="Civil 3D 2026">Civil 3D 2026</option>
          <option value="AutoCAD 2026">AutoCAD 2026</option>
        </select>
        <select id="kind">
          <option value="all">Commands + shortcuts</option>
          <option value="command">Commands only</option>
          <option value="shortcut">Shortcuts only</option>
        </select>
      </div>
      <div class="meta" id="meta"></div>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    const COMMANDS = [
      { product: "AutoCAD 2026", kind: "command", name: "LINE", shortcut: "L", description: "Create straight line segments.", tasks: ["draw a line", "start drafting geometry"] },
      { product: "AutoCAD 2026", kind: "command", name: "PLINE", shortcut: "PL", description: "Create connected polyline segments.", tasks: ["draw connected lines", "create boundary polyline"] },
      { product: "AutoCAD 2026", kind: "command", name: "CIRCLE", shortcut: "C", description: "Create circles by center/radius options.", tasks: ["draw a circle", "add round geometry"] },
      { product: "AutoCAD 2026", kind: "command", name: "ARC", shortcut: "A", description: "Create arc geometry.", tasks: ["draw an arc", "add curved segment"] },
      { product: "AutoCAD 2026", kind: "command", name: "RECTANG", shortcut: "REC", description: "Create rectangles.", tasks: ["draw a rectangle", "make a box outline"] },
      { product: "AutoCAD 2026", kind: "command", name: "OFFSET", shortcut: "O", description: "Create parallel/concentric copies.", tasks: ["offset a line", "create parallel boundary"] },
      { product: "AutoCAD 2026", kind: "command", name: "TRIM", shortcut: "TR", description: "Trim objects to edges.", tasks: ["trim excess lines", "clean intersections"] },
      { product: "AutoCAD 2026", kind: "command", name: "EXTEND", shortcut: "EX", description: "Extend objects to boundaries.", tasks: ["extend a line", "close gaps"] },
      { product: "AutoCAD 2026", kind: "command", name: "FILLET", shortcut: "F", description: "Round corners between objects.", tasks: ["round corner", "create tangent arc"] },
      { product: "AutoCAD 2026", kind: "command", name: "CHAMFER", shortcut: "CHA", description: "Bevel corners.", tasks: ["bevel corner", "cut corner at distance"] },
      { product: "AutoCAD 2026", kind: "command", name: "MOVE", shortcut: "M", description: "Move selected objects.", tasks: ["move an object", "relocate geometry"] },
      { product: "AutoCAD 2026", kind: "command", name: "COPY", shortcut: "CO", description: "Copy selected objects.", tasks: ["duplicate geometry", "copy elements"] },
      { product: "AutoCAD 2026", kind: "command", name: "ROTATE", shortcut: "RO", description: "Rotate selected objects.", tasks: ["rotate object", "turn block"] },
      { product: "AutoCAD 2026", kind: "command", name: "SCALE", shortcut: "SC", description: "Scale objects.", tasks: ["resize geometry", "scale block"] },
      { product: "AutoCAD 2026", kind: "command", name: "MIRROR", shortcut: "MI", description: "Mirror objects across an axis.", tasks: ["mirror geometry", "symmetrical copy"] },
      { product: "AutoCAD 2026", kind: "command", name: "ARRAY", shortcut: "AR", description: "Create rectangular/polar/path arrays.", tasks: ["repeat object pattern", "array objects"] },
      { product: "AutoCAD 2026", kind: "command", name: "HATCH", shortcut: "H", description: "Fill enclosed areas with hatch/solid.", tasks: ["hatch area", "fill closed boundary"] },
      { product: "AutoCAD 2026", kind: "command", name: "DIM", shortcut: "D", description: "Create and edit dimensions.", tasks: ["add dimensions", "dimension drawing"] },
      { product: "AutoCAD 2026", kind: "command", name: "MTEXT", shortcut: "MT", description: "Create multiline text.", tasks: ["add note", "insert text annotation"] },
      { product: "AutoCAD 2026", kind: "command", name: "BLOCK", shortcut: "B", description: "Define a block.", tasks: ["create reusable block", "make symbol block"] },
      { product: "AutoCAD 2026", kind: "command", name: "INSERT", shortcut: "I", description: "Insert a block reference.", tasks: ["insert block", "place symbol"] },
      { product: "AutoCAD 2026", kind: "command", name: "XREF", shortcut: "XR", description: "Attach and manage external references.", tasks: ["attach xref", "reference another drawing"] },
      { product: "AutoCAD 2026", kind: "command", name: "LAYER", shortcut: "LA", description: "Layer Properties Manager.", tasks: ["manage layers", "change layer settings"] },
      { product: "AutoCAD 2026", kind: "command", name: "MATCHPROP", shortcut: "MA", description: "Copy object properties.", tasks: ["match properties", "copy style"] },
      { product: "AutoCAD 2026", kind: "command", name: "PROPERTIES", shortcut: "PR", description: "Open Properties palette.", tasks: ["edit object properties", "inspect object settings"] },
      { product: "AutoCAD 2026", kind: "command", name: "ZOOM", shortcut: "Z", description: "Change view magnification.", tasks: ["zoom extents", "zoom to objects"] },
      { product: "AutoCAD 2026", kind: "command", name: "PAN", shortcut: "P", description: "Pan viewport.", tasks: ["move view", "pan drawing"] },
      { product: "AutoCAD 2026", kind: "command", name: "UNDO", shortcut: "U", description: "Undo previous action.", tasks: ["undo change", "revert last step"] },
      { product: "AutoCAD 2026", kind: "command", name: "REDO", shortcut: "REDO", description: "Redo undone action.", tasks: ["redo change", "restore step"] },
      { product: "AutoCAD 2026", kind: "command", name: "PURGE", shortcut: "PU", description: "Remove unused named objects.", tasks: ["clean drawing", "remove unused blocks and layers"] },
      { product: "AutoCAD 2026", kind: "command", name: "AUDIT", shortcut: "AUDIT", description: "Check and repair drawing errors.", tasks: ["fix drawing errors", "audit file"] },
      { product: "AutoCAD 2026", kind: "command", name: "PLOT", shortcut: "CTRL+P", description: "Print or plot drawing.", tasks: ["print drawing", "plot layout"] },
      { product: "AutoCAD 2026", kind: "command", name: "EXPORTPDF", shortcut: "PDF", description: "Export drawing to PDF.", tasks: ["create pdf", "export plan sheet"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "CTRL+1", shortcut: "CTRL+1", description: "Open Properties palette.", tasks: ["open properties quickly", "inspect selected object"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "CTRL+2", shortcut: "CTRL+2", description: "Open DesignCenter palette.", tasks: ["reuse content", "browse external drawing content"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "CTRL+3", shortcut: "CTRL+3", description: "Open Tool Palettes window.", tasks: ["open tool palettes", "access custom tools"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "CTRL+9", shortcut: "CTRL+9", description: "Toggle command line visibility.", tasks: ["show command line", "hide command line"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "F3", shortcut: "F3", description: "Toggle Object Snap.", tasks: ["turn on osnap", "precision snapping"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "F8", shortcut: "F8", description: "Toggle Ortho mode.", tasks: ["lock to horizontal and vertical", "draw orthogonal"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "CTRL+S", shortcut: "CTRL+S", description: "Save current drawing.", tasks: ["save drawing quickly", "quick save"] },
      { product: "AutoCAD 2026", kind: "shortcut", name: "CTRL+Z", shortcut: "CTRL+Z", description: "Undo action.", tasks: ["undo keyboard", "revert with keyboard"] },
      { product: "Civil 3D 2026", kind: "command", name: "SURFACECREATE", shortcut: "N/A", description: "Create a new Civil 3D surface.", tasks: ["create a surface", "start terrain model"] },
      { product: "Civil 3D 2026", kind: "command", name: "EDITSURFACE", shortcut: "N/A", description: "Edit existing surface data.", tasks: ["edit a surface", "refine terrain model"] },
      { product: "Civil 3D 2026", kind: "command", name: "ALIGNMENTCREATE", shortcut: "N/A", description: "Create an alignment from layout/tools.", tasks: ["create alignment", "define road centerline"] },
      { product: "Civil 3D 2026", kind: "command", name: "PROFILECREATE", shortcut: "N/A", description: "Create design profile geometry.", tasks: ["create profile", "design vertical alignment"] },
      { product: "Civil 3D 2026", kind: "command", name: "PROFILEVIEWCREATE", shortcut: "N/A", description: "Create profile view drawing.", tasks: ["create profile view", "show profile on sheet"] },
      { product: "Civil 3D 2026", kind: "command", name: "CORRIDORCREATE", shortcut: "N/A", description: "Build a corridor model from alignment/profile/assembly.", tasks: ["create corridor", "build road model"] },
      { product: "Civil 3D 2026", kind: "command", name: "CORRIDORPROPERTIES", shortcut: "N/A", description: "Edit corridor settings and regions.", tasks: ["edit corridor", "modify corridor regions"] },
      { product: "Civil 3D 2026", kind: "command", name: "ASSEMBLYCREATE", shortcut: "N/A", description: "Create assemblies used by corridor models.", tasks: ["create assembly", "build typical section"] },
      { product: "Civil 3D 2026", kind: "command", name: "SAMPLELINECREATE", shortcut: "N/A", description: "Create sample lines along alignments.", tasks: ["create sample lines", "prepare cross sections"] },
      { product: "Civil 3D 2026", kind: "command", name: "SECTIONVIEWCREATE", shortcut: "N/A", description: "Create section views.", tasks: ["create section view", "plot cross section"] },
      { product: "Civil 3D 2026", kind: "command", name: "GRADINGCREATE", shortcut: "N/A", description: "Create grading objects.", tasks: ["create grading", "grade to target"] },
      { product: "Civil 3D 2026", kind: "command", name: "FEATURELINECREATE", shortcut: "N/A", description: "Create feature lines.", tasks: ["create feature line", "define breakline geometry"] },
      { product: "Civil 3D 2026", kind: "command", name: "PARCELCREATE", shortcut: "N/A", description: "Create parcels from objects.", tasks: ["create parcel", "subdivide lots"] },
      { product: "Civil 3D 2026", kind: "command", name: "POINTCREATE", shortcut: "N/A", description: "Create COGO points.", tasks: ["create cogo points", "insert survey points"] },
      { product: "Civil 3D 2026", kind: "command", name: "POINTGROUP", shortcut: "N/A", description: "Create and edit point groups.", tasks: ["organize points", "filter cogo points"] },
      { product: "Civil 3D 2026", kind: "command", name: "PIPECREATE", shortcut: "N/A", description: "Create gravity pipe networks.", tasks: ["create pipe network", "design storm sewer"] },
      { product: "Civil 3D 2026", kind: "command", name: "PRESSURENETWORKCREATE", shortcut: "N/A", description: "Create pressure pipe networks.", tasks: ["create pressure network", "design water line"] },
      { product: "Civil 3D 2026", kind: "command", name: "NETWORKLAYOUTTOOLS", shortcut: "N/A", description: "Open network layout tools.", tasks: ["layout pipes", "edit network layout"] },
      { product: "Civil 3D 2026", kind: "command", name: "LABELSTYLECOMPOSER", shortcut: "N/A", description: "Edit Civil label style components.", tasks: ["customize labels", "edit label style"] },
      { product: "Civil 3D 2026", kind: "command", name: "ADDLABELS", shortcut: "N/A", description: "Add labels to Civil objects.", tasks: ["label alignment", "label surface contours"] },
      { product: "Civil 3D 2026", kind: "command", name: "CREATESURFACEFROMPOINTCLOUD", shortcut: "N/A", description: "Generate surface from point cloud sources.", tasks: ["surface from point cloud", "convert lidar to surface"] },
      { product: "Civil 3D 2026", kind: "command", name: "VOLUMEDASHBOARD", shortcut: "N/A", description: "Compute and review earthwork volumes.", tasks: ["calculate cut fill", "compare surfaces"] },
      { product: "Civil 3D 2026", kind: "command", name: "QUICKPROFILE", shortcut: "N/A", description: "Create quick profile from existing objects.", tasks: ["quick profile check", "inspect elevations quickly"] },
      { product: "Civil 3D 2026", kind: "command", name: "MAPCHECK", shortcut: "N/A", description: "Analyze parcel traverse closure.", tasks: ["check parcel closure", "verify legal description"] },
      { product: "Civil 3D 2026", kind: "command", name: "OBJECTVIEWER", shortcut: "N/A", description: "View Civil object model details.", tasks: ["inspect corridor model", "review object geometry"] },
      { product: "Civil 3D 2026", kind: "shortcut", name: "Prospector Tab", shortcut: "TOOLSPACE", description: "Access Prospector in Toolspace.", tasks: ["manage civil objects", "browse surfaces and alignments"] },
      { product: "Civil 3D 2026", kind: "shortcut", name: "Settings Tab", shortcut: "TOOLSPACE", description: "Access drawing/feature settings.", tasks: ["edit civil styles", "change command defaults"] },
      { product: "Civil 3D 2026", kind: "shortcut", name: "Survey Tab", shortcut: "TOOLSPACE", description: "Access survey databases and figures.", tasks: ["manage survey data", "import fieldbook"] },
      { product: "Civil 3D 2026", kind: "shortcut", name: "Analyze Tab", shortcut: "TOOLSPACE", description: "Access analysis tools.", tasks: ["run analysis", "inspect design criteria checks"] }
    ];

    const queryEl = document.getElementById("query");
    const productEl = document.getElementById("product");
    const kindEl = document.getElementById("kind");
    const resultsEl = document.getElementById("results");
    const metaEl = document.getElementById("meta");

    function normalize(text) {
      return String(text || "").toLowerCase().replace(/[^a-z0-9+ ]+/g, " ").replace(/\s+/g, " ").trim();
    }

    function searchCommands(query, product, kind) {
      const q = normalize(query);
      const qTokens = q.split(" ").filter(Boolean);
      return COMMANDS
        .filter((item) => (product === "all" || item.product === product) && (kind === "all" || item.kind === kind))
        .map((item) => {
          const haystack = normalize([item.name, item.shortcut, item.description, item.tasks.join(" ")].join(" "));
          let score = q ? 0 : 1;
          if (q && haystack.includes(q)) score += 8;
          for (const token of qTokens) {
            if (token.length > 1 && haystack.includes(token)) score += 1;
          }
          return { ...item, score };
        })
        .filter((item) => item.score > 0)
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
    }

    function render() {
      const matches = searchCommands(queryEl.value, productEl.value, kindEl.value);
      metaEl.textContent = `${matches.length} result(s) from ${COMMANDS.length} indexed Civil 3D/AutoCAD 2026 entries.`;
      if (!matches.length) {
        resultsEl.innerHTML = '<div class="empty">No match found. Try terms like "surface", "alignment", "pipe network", "trim", or "layer".</div>';
        return;
      }
      resultsEl.innerHTML = matches.slice(0, 30).map((item) => `
        <article class="card">
          <div class="top">
            <div class="name">${item.name}</div>
            <div class="badge">${item.product} • ${item.kind}</div>
          </div>
          <div class="shortcut">Shortcut: ${item.shortcut}</div>
          <div class="task">${item.description}</div>
          <div class="task">Useful for: ${item.tasks.join(", ")}</div>
        </article>
      `).join("");
    }

    queryEl.addEventListener("input", render);
    productEl.addEventListener("change", render);
    kindEl.addEventListener("change", render);
    render();
  </script>
</body>
</html>
